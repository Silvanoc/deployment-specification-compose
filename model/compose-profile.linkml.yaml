# yaml-language-server: $schema=https://linkml.io/linkml-model/linkml_model/jsonschema/meta.schema.json
id: https://specification.margo.org/compose-profile
name: ComposeProfileModel
title: Compose Profile Characteristics
description: Characteristics applicable to workload targets supporting Compose.
prefixes:
  linkml: https://w3id.org/linkml/
  margo: https://specification.margo.org/
  margo-common: https://raw.githubusercontent.com/Silvanoc/margo-specification/externalize-component-specs/model/
imports:
  - linkml:types
  - margo-common:workload-target-characteristics.linkml
default_prefix: margo

subsets:
  DeploymentTechnologyCharacteristics:
    description: Characteristics indicating support for a deployment technology.

classes:
  ComposeProfile:
    description: Profile containing characteristics of a Compose workload target.
    is_a: WorkloadTargetProfile
    tree_root: true
    all_of:
      - slot_conditions:
          characteristics:
            has_member:
              range: ComposeDeploymentCharacteristic
      - slot_conditions:
          characteristics:
            has_member:
              range: CpuCharacteristic
      - slot_conditions:
          characteristics:
            has_member:
              range: MemoryCharacteristic
      - slot_conditions:
          characteristics:
            has_member:
              range: StorageCharacteristic
      - slot_conditions:
          characteristics:
            has_member:
              range: PeripheralsCharacteristic
      - slot_conditions:
          characteristics:
            has_member:
              range: InterfacesCharacteristic
    slot_usage:
      characteristics:
        # slot_usage replaces the inherited union, so repeat the shared ranges.
        any_of:
          - range: ComposeDeploymentCharacteristic
          - range: CpuCharacteristic
          - range: MemoryCharacteristic
          - range: StorageCharacteristic
          - range: PeripheralsCharacteristic
          - range: InterfacesCharacteristic
          - range: ComposeOtherCharacteristic
  ComposeOtherCharacteristic:
    is_a: OtherCharacteristic
    slot_usage:
      key:
        pattern: '^(?!margo\.org/(?:deployment/compose|resource/(?:cpu|memory|storage)|peripherals|interfaces)(?![\s\S]))'
  ComposeDeploymentCharacteristic:
    title: Compose Deployment Technology Support
    description: The following required characteristics indicate a workload target is capable of deploying Compose workloads.
    rank: 10
    in_subset: [DeploymentTechnologyCharacteristics]
    attributes:
      key:
        range: string
        required: true
        equals_string: margo.org/deployment/compose
      properties:
        range: ComposeDeploymentProperties
        inlined: true
        required: true
  ComposeDeploymentProperties:
    title: Compose Deployment Technology
    description: The properties for the Compose deployment technology will be defined once the deployment technology specifications are separated from the core specification.
    extra_slots:
      allowed: true
