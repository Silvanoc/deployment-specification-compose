# yaml-language-server: $schema=https://linkml.io/linkml-model/linkml_model/jsonschema/meta.schema.json
id: https://specification.margo.org/deployment/compose-application
name: ComposeApplicationDescription
title: Application Description Schema
annotations:
  margo_optional_typed_nonnull: "true"
description: Compose-specific constraints on the shared Application Description.
version: "1.0"
prefixes:
  linkml: https://w3id.org/linkml/
  margo: https://specification.margo.org/
  margo-common: https://raw.githubusercontent.com/Silvanoc/margo-specification/externalize-component-specs/model/
imports:
  - linkml:types
  - margo-common:application-description.linkml
  - margo-common:oci-component-properties.linkml
default_prefix: margo

classes:
  ComposeDeploymentProfile:
    is_a: DeploymentProfile
    extra_slots:
      allowed: false
    slot_usage:
      key:
        equals_string: margo.org/deployment/compose
      components:
        range: ComposeComponent

  ComposeComponent:
    is_a: Component
    extra_slots:
      allowed: false
    slot_usage:
      properties:
        range: ComposeComponentProperties

  ComposeComponentProperties:
    is_a: OCIComponentProperties
    extra_slots:
      allowed: false
    slot_usage:
      wait:
        description: >-
          The `component.properties.wait` property: if `wait` is set to `true` for a Compose component, the device MUST wait until all containers in the Compose project reach **running** state before reporting the deployment as successful. This is equivalent to `docker compose up` or `podman-compose up` completing synchronously without `--detach`. If any container exits with a non-zero exit code during startup, the deployment MUST be reported as failed immediately. If health checks are defined in `compose.yaml`, implementations SHOULD additionally wait for all containers to reach **healthy** state before reporting success.

  ComposeParameterTarget:
    is_a: ParameterTarget
    slot_usage:
      pointer:
        description: The `parameter.targets[].pointer` MUST be the environment variable name the Compose files expect to use.
